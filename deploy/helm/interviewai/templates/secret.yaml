apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "interviewai.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ include "interviewai.databaseUrl" . | quote }}
  JWT_SECRET: {{ .Values.jwtSecret | quote }}

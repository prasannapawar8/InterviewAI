apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    {{- include "interviewai.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.web.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    {{- include "interviewai.labels" . | nindent 4 }}
    app.kubernetes.io/name: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        {{- include "interviewai.labels" . | nindent 8 }}
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image }}:{{ .Values.web.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - { name: API_UPSTREAM, value: "api:4000" }
          ports:
            - { name: http, containerPort: 80 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
